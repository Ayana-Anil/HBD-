<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Birthday 🎂</title>
  <meta name="description" content="An interactive birthday celebration card with candles, confetti, and love messages." />

  <!-- Google Fonts: playful handwritten + display -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Patrick+Hand&family=Caveat:wght@400;700&display=swap" rel="stylesheet" />

  <!-- canvas-confetti CDN -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <style>
    /* ══════════════════════════════════════════════
       RESET & BASE
       ══════════════════════════════════════════════ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      font-family: 'Patrick Hand', cursive;
      background: #f9f3f0;
    }

    /* ══════════════════════════════════════════════
       OUTER FRAME — red gingham border
       ══════════════════════════════════════════════ */
    .frame {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      /* gingham pattern via layered gradients */
      background-color: #fff;
      background-image:
        linear-gradient(45deg, #d4343488 25%, transparent 25%, transparent 75%, #d4343488 75%),
        linear-gradient(45deg, #d4343488 25%, transparent 25%, transparent 75%, #d4343488 75%),
        linear-gradient(to right, #e8606044 50%, transparent 50%),
        linear-gradient(to bottom, #e8606044 50%, transparent 50%);
      background-size: 30px 30px, 30px 30px, 30px 30px, 30px 30px;
      background-position: 0 0, 15px 15px, 0 0, 0 0;
    }

    /* ══════════════════════════════════════════════
       INNER CANVAS — grid / notebook paper
       ══════════════════════════════════════════════ */
    .canvas {
      position: relative;
      z-index: 6; /* above polaroids so the white card is never covered */
      width: calc(100% - 48px);
      height: calc(100% - 48px);
      max-width: 820px;
      max-height: 540px;
      background-color: #fff;
      background-image:
        linear-gradient(#e0d8d4 1px, transparent 1px),
        linear-gradient(90deg, #e0d8d4 1px, transparent 1px);
      background-size: 24px 24px;
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 4px 24px rgba(0,0,0,.08);
    }

    /* ══════════════════════════════════════════════
       CORNER STARS  (SVG drawn inline)
       ══════════════════════════════════════════════ */
    .star {
      position: absolute; z-index: 5;
      width: 64px; height: 64px;
      /* ★ SWAP: Replace with your own star sticker image
         e.g. <img src="YOUR_STAR_STICKER_URL" ... /> */
    }
    .star svg { width: 100%; height: 100%; }
    .star--tl { top: -8px; left: -8px; transform: rotate(-12deg); }
    .star--tr { top: -8px; right: -8px; transform: rotate(15deg); }
    .star--bl { bottom: -8px; left: -8px; transform: rotate(8deg); }
    .star--br { bottom: -8px; right: -8px; transform: rotate(-10deg); }

    /* ══════════════════════════════════════════════
       POLAROID PHOTOS — pasted on gingham border,
       overlapping onto the canvas edges like a collage.
       ══════════════════════════════════════════════ */
    .polaroid {
      position: absolute;
      z-index: 2; /* behind the canvas so photos frame the card */
      background: #fff;
      padding: 6px 6px 24px 6px;  /* longer bottom = polaroid style */
      box-shadow: 2px 3px 12px rgba(0,0,0,.25), 0 0 0 1px rgba(0,0,0,.06);
      pointer-events: none;
      transition: transform .3s ease, box-shadow .3s ease;
    }
    .polaroid img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 40%; /* crop black bars */
    }

    /* ── Sizes (BIG) ── */
    .polaroid--sm  { width: 200px; height: 170px; padding: 6px 6px 24px 6px; }
    .polaroid--md  { width: 250px; height: 210px; padding: 7px 7px 28px 7px; }
    .polaroid--lg  { width: 300px; height: 250px; padding: 8px 8px 32px 8px; }

    /* ── Positions: pulled INWARD so fully visible ── */

    /* ====== TOP EDGE (5 photos) ====== */
    .pol-1  { top: 2%;   left: 6%;    transform: rotate(-7deg); }
    .pol-2  { top: 1%;   left: 22%;   transform: rotate(5deg); }
    .pol-3  { top: 2%;   left: 42%;   transform: rotate(-3deg); }
    .pol-4  { top: 1%;   right: 22%;  transform: rotate(6deg); }
    .pol-5  { top: 2%;   right: 6%;   transform: rotate(-4deg); }

    /* ====== RIGHT EDGE (3 photos) ====== */
    .pol-6  { top: 24%;    right: 4%;  transform: rotate(5deg); }
    .pol-7  { top: 46%;    right: 5%;  transform: rotate(-6deg); }
    .pol-8  { bottom: 20%; right: 4%;  transform: rotate(4deg); }

    /* ====== BOTTOM EDGE (5 photos) ====== */
    .pol-9  { bottom: 2%;  left: 6%;    transform: rotate(6deg); }
    .pol-10 { bottom: 1%;  left: 24%;   transform: rotate(-4deg); }
    .pol-11 { bottom: 2%;  left: 42%;   transform: rotate(3deg); }
    .pol-12 { bottom: 1%;  right: 22%;  transform: rotate(-5deg); }
    .pol-13 { bottom: 2%;  right: 6%;   transform: rotate(7deg); }

    /* ====== LEFT EDGE (3 photos) ====== */
    .pol-14 { top: 24%;    left: 4%;   transform: rotate(-5deg); }
    .pol-15 { top: 46%;    left: 5%;   transform: rotate(6deg); }
    .pol-16 { bottom: 20%; left: 4%;   transform: rotate(-3deg); }

    /* ====== EXTRAS — smaller, peeking near top of canvas ====== */
    .pol-17 { top: 4%;   left: 30%;   transform: rotate(8deg); }
    .pol-18 { top: 4%;   right: 30%;  transform: rotate(-7deg); }
    .polaroid.polaroid--xs  { width: 140px; height: 120px; padding: 4px 4px 18px 4px; }

    @media (max-width: 600px) {
      .star { width: 44px; height: 44px; }
      .polaroid--sm  { width: 120px; height: 100px; padding: 4px 4px 16px 4px; }
      .polaroid--md  { width: 145px; height: 120px; padding: 5px 5px 18px 5px; }
      .polaroid--lg  { width: 175px; height: 145px; padding: 5px 5px 22px 5px; }
    }

    /* ══════════════════════════════════════════════
       BUNTING / PENNANT FLAGS
       ══════════════════════════════════════════════ */
    .bunting {
      position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
      z-index: 4; width: 260px; height: 50px;
      /* ★ SWAP: Replace with your own bunting image
         e.g. background-image: url('YOUR_BUNTING_URL'); */
    }
    @media (max-width: 600px) { .bunting { width: 180px; height: 36px; top: 6px; } }

    /* ══════════════════════════════════════════════
       SCENES (state containers)
       ══════════════════════════════════════════════ */
    .scene {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      opacity: 0; pointer-events: none;
      transition: opacity .6s ease, transform .5s ease;
      transform: scale(.96);
      padding: 20px;
    }
    .scene.active {
      opacity: 1; pointer-events: auto;
      transform: scale(1);
    }

    /* ══════════════════════════════════════════════
       SHARED TYPOGRAPHY
       ══════════════════════════════════════════════ */
    .title {
      font-family: 'Dancing Script', cursive;
      font-size: clamp(28px, 5vw, 48px);
      color: #c0392b;
      text-align: center;
      line-height: 1.15;
      margin-bottom: 8px;
      text-shadow: 1px 1px 0 #f5c6c0;
    }
    .subtitle {
      font-family: 'Patrick Hand', cursive;
      font-size: clamp(18px, 3vw, 26px);
      color: #444;
      text-align: center;
      margin-bottom: 12px;
    }

    /* ══════════════════════════════════════════════
       BUTTONS
       ══════════════════════════════════════════════ */
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      font-family: 'Patrick Hand', cursive;
      font-size: clamp(16px, 2.5vw, 22px);
      color: #c0392b;
      background: transparent;
      border: 2.5px solid #c0392b;
      border-radius: 999px;
      padding: 8px 32px;
      cursor: pointer;
      transition: background .25s, color .25s, transform .2s;
      position: relative;
      z-index: 10;
    }
    .btn:hover {
      background: #c0392b; color: #fff;
      transform: scale(1.06);
    }
    .btn:active { transform: scale(.97); }

    /* pulse animation for the primary CTA */
    .btn--pulse {
      animation: pulse 1.8s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(192,57,43,.4); }
      50% { box-shadow: 0 0 0 12px rgba(192,57,43,0); }
    }

    /* ══════════════════════════════════════════════
       SCENE 1 — MAKE A WISH  (cake + candles)
       ══════════════════════════════════════════════ */
    .cake-wrapper {
      position: relative;
      width: clamp(140px, 28vw, 220px);
      height: clamp(160px, 32vw, 260px);
      margin: 0 auto 10px;
    }
    /* ★ SWAP: Replace the cake SVG below with your own sticker:
       <img src="STICKER_CAKE_LIT_URL" class="cake-img" alt="Birthday cake" /> */
    .cake-img {
      width: 100%; height: 100%;
      object-fit: contain;
    }

    /* candle flames — little CSS-drawn flames */
    .flames {
      position: absolute;
      top: 4%; left: 50%; transform: translateX(-50%);
      display: flex; gap: 14px;
    }
    .flame {
      width: 10px; height: 18px;
      background: radial-gradient(ellipse at 50% 90%, #f7dc6f 30%, #e74c3c 70%, transparent 100%);
      border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
      animation: flicker .4s ease-in-out infinite alternate;
      filter: blur(.5px);
    }
    .flame:nth-child(2) { animation-delay: .15s; width: 9px; height: 16px; }
    .flame:nth-child(3) { animation-delay: .3s; width: 11px; height: 17px; }

    @keyframes flicker {
      0% { transform: scaleY(1) rotate(-3deg); opacity: 1; }
      100% { transform: scaleY(1.2) rotate(3deg); opacity: .85; }
    }

    .flames.blown-out .flame {
      animation: none;
      opacity: 0;
      transition: opacity .3s;
    }

    /* smoke puffs */
    .smoke {
      position: absolute; top: 0%; left: 50%; transform: translateX(-50%);
      display: flex; gap: 10px;
      opacity: 0;
    }
    .smoke.show { animation: smokePuff 1.2s ease-out forwards; }
    .smoke-particle {
      width: 12px; height: 12px;
      background: rgba(180,180,180,.5);
      border-radius: 50%;
      filter: blur(4px);
    }
    @keyframes smokePuff {
      0% { opacity: 1; transform: translateX(-50%) translateY(0); }
      100% { opacity: 0; transform: translateX(-50%) translateY(-40px) scale(2); }
    }

    /* party popper sticker */
    .popper {
      position: absolute; right: 8%; bottom: 18%;
      width: clamp(50px, 12vw, 90px);
      /* ★ SWAP: Replace with your party popper sticker image */
    }
    .popper img, .popper svg { width: 100%; height: auto; }

    /* floating hearts doodle */
    .doodle-hearts {
      position: absolute;
      /* positioned differently per scene */
    }

    /* ══════════════════════════════════════════════
       SCENE 2 — BLOWN OUT  (bunny character)
       ══════════════════════════════════════════════ */
    .character {
      width: clamp(80px, 18vw, 140px);
      position: absolute;
      /* ★ SWAP: Replace with your character sticker image
         e.g. <img src="STICKER_BUNNY_URL" ... /> */
    }
    .character--bunny { right: 6%; bottom: 8%; }
    .character--penguin { right: 6%; bottom: 8%; }
    .character--left { left: 6%; bottom: 14%; }
    .character--dino { left: 50%; bottom: 4%; transform: translateX(-50%); }

    .character img, .character svg { width: 100%; height: auto; }

    /* pop-in animation for characters */
    .pop-in {
      animation: popIn .5s cubic-bezier(.175,.885,.32,1.275) forwards;
    }
    @keyframes popIn {
      0% { opacity: 0; transform: scale(.3); }
      100% { opacity: 1; transform: scale(1); }
    }

    /* idle wobble */
    .wobble {
      animation: wobble 2.5s ease-in-out infinite;
    }
    @keyframes wobble {
      0%, 100% { transform: rotate(-2deg) translateY(0); }
      25% { transform: rotate(1deg) translateY(-4px); }
      50% { transform: rotate(-1deg) translateY(0); }
      75% { transform: rotate(2deg) translateY(-3px); }
    }

    /* ══════════════════════════════════════════════
       SCENE 3 — TAP TO OPEN (envelope)
       ══════════════════════════════════════════════ */
    .envelope-wrapper {
      position: relative;
      width: clamp(160px, 34vw, 280px);
      cursor: pointer;
      transition: transform .3s;
    }
    .envelope-wrapper:hover { transform: scale(1.04); }
    .envelope-wrapper:active { transform: scale(.97); }

    .envelope {
      width: 100%;
      aspect-ratio: 4 / 3;
      background: #c0392b;
      border-radius: 8px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 6px 20px rgba(192,57,43,.25);
    }
    /* flap */
    .envelope::before {
      content: '';
      position: absolute; top: 0; left: 50%;
      width: 120%; height: 55%;
      background: #a93226;
      transform: translateX(-50%) rotate(0deg);
      clip-path: polygon(50% 55%, 0 0, 100% 0);
    }
    /* heart seal */
    .heart-seal {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      z-index: 2;
      font-size: clamp(32px, 7vw, 56px);
      filter: drop-shadow(0 2px 4px rgba(0,0,0,.15));
      animation: heartbeat 1.4s ease-in-out infinite;
    }
    @keyframes heartbeat {
      0%, 100% { transform: translate(-50%, -50%) scale(1); }
      15% { transform: translate(-50%, -50%) scale(1.15); }
      30% { transform: translate(-50%, -50%) scale(1); }
      45% { transform: translate(-50%, -50%) scale(1.1); }
    }

    /* "OPEN" label on envelope */
    .envelope-label {
      position: absolute; bottom: 18%; left: 50%;
      transform: translateX(-50%);
      font-family: 'Patrick Hand', cursive;
      font-size: clamp(12px, 2vw, 18px);
      color: rgba(255,255,255,.7);
      letter-spacing: 3px;
      z-index: 2;
    }

    /* ══════════════════════════════════════════════
       SCENE 4 — LOVE MESSAGE CARD
       ══════════════════════════════════════════════ */
    .message-card {
      position: relative;
      width: clamp(180px, 38vw, 300px);
      background: #fff;
      border: 3px solid #c0392b;
      border-radius: 8px;
      padding: 16px 20px;
      box-shadow: 4px 4px 0 #c0392b;
      text-align: center;
    }
    .message-card .stickman {
      width: clamp(80px, 18vw, 140px);
      margin: 0 auto 8px;
      /* ★ SWAP: Replace with your stickman / love illustration image */
    }
    .message-card .stickman img,
    .message-card .stickman svg { width: 100%; height: auto; }

    .message-card .msg-text {
      font-family: 'Caveat', cursive;
      font-size: clamp(18px, 3.5vw, 30px);
      color: #333;
      line-height: 1.3;
    }
    .message-card .msg-text .heart-emoji {
      color: #e74c3c;
      font-size: 1.2em;
    }

    /* balloons cluster */
    .balloons {
      position: absolute; right: -16%; top: -10%;
      display: flex; gap: 4px;
    }
    .balloon {
      width: clamp(18px, 4vw, 30px);
      height: clamp(24px, 5vw, 38px);
      border-radius: 50% 50% 50% 50% / 55% 55% 45% 45%;
      position: relative;
      animation: float 3s ease-in-out infinite;
    }
    .balloon::after {
      content: '';
      position: absolute; bottom: -12px; left: 50%;
      width: 1px; height: 14px;
      background: #999;
      transform: translateX(-50%);
    }
    .balloon:nth-child(1) { background: #e74c3c; animation-delay: 0s; }
    .balloon:nth-child(2) { background: #e67e22; animation-delay: .3s; }
    .balloon:nth-child(3) { background: #3498db; animation-delay: .6s; }
    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(-2deg); }
      50% { transform: translateY(-8px) rotate(2deg); }
    }

    /* ══════════════════════════════════════════════
       SCENE 5 — HUG MESSAGE
       ══════════════════════════════════════════════ */
    .hug-illustration {
      position: relative;
      width: clamp(200px, 45vw, 380px);
      height: clamp(140px, 30vw, 240px);
      display: flex; align-items: center; justify-content: center;
    }
    .hug-illustration .hug-char {
      position: absolute;
      width: clamp(60px, 14vw, 110px);
      /* ★ SWAP: Replace with your hug character sticker images */
    }
    .hug-illustration .hug-char img,
    .hug-illustration .hug-char svg { width: 100%; height: auto; }
    .hug-char--left { left: 0; bottom: 0; }
    .hug-char--center { left: 50%; bottom: 0; transform: translateX(-50%); z-index: 2; }
    .hug-char--right { right: 0; bottom: 0; }

    /* ══════════════════════════════════════════════
       SCENE-SPECIFIC BUTTON PLACEMENT
       ══════════════════════════════════════════════ */
    .btn-area {
      position: absolute;
      z-index: 10;
    }
    .btn-area--left { left: 8%; bottom: 14%; }
    .btn-area--right { right: 8%; bottom: 14%; }
    .btn-area--center { bottom: 10%; left: 50%; transform: translateX(-50%); }

    /* ══════════════════════════════════════════════
       SCATTERED DOODLE HEARTS (decorative)
       ══════════════════════════════════════════════ */
    .mini-hearts {
      position: absolute;
      z-index: 3;
      pointer-events: none;
    }
    .mini-hearts svg { width: 100%; height: 100%; }

    /* ══════════════════════════════════════════════
       RESPONSIVE TWEAKS
       ══════════════════════════════════════════════ */
    @media (max-width: 600px) {
      .canvas {
        width: calc(100% - 28px);
        height: calc(100% - 28px);
        max-height: 100%;
      }
      .btn { padding: 6px 24px; font-size: 16px; }
      .message-card { padding: 10px 14px; }
      .star { width: 36px; height: 36px; }
      .frame {
        background-size: 20px 20px, 20px 20px, 20px 20px, 20px 20px;
        background-position: 0 0, 10px 10px, 0 0, 0 0;
      }
    }

    @media (max-width: 400px) {
      .bunting { width: 140px; height: 28px; }
      .character { width: clamp(60px, 16vw, 100px); }
    }

    /* ══════════════════════════════════════════════
       FINAL MESSAGE SLIDE-UP
       ══════════════════════════════════════════════ */
    .slide-up {
      animation: slideUp .7s cubic-bezier(.22,1,.36,1) forwards;
    }
    @keyframes slideUp {
      0% { opacity: 0; transform: translateY(40px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    /* scale-bounce on blow */
    .scale-bounce {
      animation: scaleBounce .5s cubic-bezier(.175,.885,.32,1.275);
    }
    @keyframes scaleBounce {
      0% { transform: scale(1); }
      40% { transform: scale(1.18); }
      100% { transform: scale(1); }
    }

    /* ══════════════════════════════════════════════
       RESTART BUTTON (after last scene)
       ══════════════════════════════════════════════ */
    .btn--restart {
      margin-top: 12px;
      font-size: 14px;
      padding: 6px 20px;
      opacity: .7;
    }
    .btn--restart:hover { opacity: 1; }
  </style>
</head>

<body>

<div class="frame">
  <div class="canvas" id="canvas">

    <!-- ────────────── CORNER STARS ────────────── -->
    <!-- ★ SWAP: Replace each star SVG with your own star sticker:
         <img src="YOUR_STAR_STICKER_URL" alt="star" /> -->
    <div class="star star--tl">
      <svg viewBox="0 0 80 80" fill="#c0392b" xmlns="http://www.w3.org/2000/svg">
        <path d="M40 4 L48 28 L74 28 L53 44 L60 70 L40 54 L20 70 L27 44 L6 28 L32 28 Z" stroke="#a93226" stroke-width="2" fill="#c0392b"/>
      </svg>
    </div>
    <div class="star star--tr">
      <svg viewBox="0 0 80 80" fill="#c0392b" xmlns="http://www.w3.org/2000/svg">
        <path d="M40 4 L48 28 L74 28 L53 44 L60 70 L40 54 L20 70 L27 44 L6 28 L32 28 Z" stroke="#a93226" stroke-width="2" fill="#c0392b"/>
      </svg>
    </div>
    <div class="star star--bl">
      <svg viewBox="0 0 80 80" fill="#c0392b" xmlns="http://www.w3.org/2000/svg">
        <path d="M40 4 L48 28 L74 28 L53 44 L60 70 L40 54 L20 70 L27 44 L6 28 L32 28 Z" stroke="#a93226" stroke-width="2" fill="#c0392b"/>
      </svg>
    </div>
    <div class="star star--br">
      <svg viewBox="0 0 80 80" fill="#c0392b" xmlns="http://www.w3.org/2000/svg">
        <path d="M40 4 L48 28 L74 28 L53 44 L60 70 L40 54 L20 70 L27 44 L6 28 L32 28 Z" stroke="#a93226" stroke-width="2" fill="#c0392b"/>
      </svg>
    </div>

    <!-- ────────────── BUNTING / PENNANT FLAGS ────────────── -->
    <!-- ★ SWAP: Replace this SVG with your own bunting image:
         <img src="YOUR_BUNTING_URL" alt="bunting" style="width:100%;height:100%" /> -->
    <div class="bunting">
      <svg viewBox="0 0 280 56" fill="none" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%">
        <!-- string -->
        <path d="M10 12 Q70 36 140 16 Q210 -4 270 18" stroke="#c0392b" stroke-width="1.5" fill="none" stroke-linecap="round"/>
        <!-- flags -->
        <polygon points="40,18 28,44 52,44" fill="#c0392b" opacity=".85"/>
        <circle cx="40" cy="32" r="3" fill="#fff" opacity=".5"/>
        <polygon points="80,12 68,38 92,38" fill="#fff" stroke="#c0392b" stroke-width="1.2"/>
        <circle cx="80" cy="26" r="2.5" fill="#c0392b" opacity=".5"/>
        <circle cx="75" cy="22" r="1.5" fill="#c0392b" opacity=".4"/>
        <circle cx="85" cy="22" r="1.5" fill="#c0392b" opacity=".4"/>
        <polygon points="120,10 108,36 132,36" fill="#c0392b" opacity=".85"/>

<script>
  /* ══════════════════════════════════════════════════════════
     STATE MANAGEMENT
     ══════════════════════════════════════════════════════════ */
  let currentScene = 1;

  function goToScene(n) {
    const prev = document.getElementById(`scene${currentScene}`);
    const next = document.getElementById(`scene${n}`);

    if (prev) prev.classList.remove('active');

    // small delay for crossfade
    setTimeout(() => {
      if (next) next.classList.add('active');
      currentScene = n;

      // fire confetti on certain scenes
      if (n === 2) fireConfetti();
      if (n === 4) fireHearts();
    }, 100);
  }

  /* ══════════════════════════════════════════════════════════
     SCENE 1 → 2 : BLOW CANDLES
     ══════════════════════════════════════════════════════════ */
  function handleBlow() {
    const flames = document.getElementById('flames');
    const smoke = document.getElementById('smoke');
    const cakeWrapper = document.getElementById('cakeWrapper');
    const btn = document.getElementById('btnBlow');

    // blow out flames
    flames.classList.add('blown-out');

    // show smoke
    smoke.classList.add('show');

    // pop sound
    playPopSound();

    // bounce
    cakeWrapper.classList.add('scale-bounce');

    // confetti burst
    fireConfetti();

    // disable button
    btn.disabled = true;
    btn.style.opacity = '.5';

    // transition to scene 2 after a beat
    setTimeout(() => goToScene(2), 1400);
  }

  /* ══════════════════════════════════════════════════════════
     SCENE 3 : OPEN ENVELOPE
     ══════════════════════════════════════════════════════════ */
  function handleOpenEnvelope() {
    const wrapper = document.getElementById('envelopeBtn');
    wrapper.classList.add('scale-bounce');

    playPopSound();

    setTimeout(() => goToScene(4), 600);
  }

  /* ══════════════════════════════════════════════════════════
     CONFETTI
     ══════════════════════════════════════════════════════════ */
  function fireConfetti() {
    if (typeof confetti !== 'function') return;

    // burst from both sides
    confetti({
      particleCount: 80,
      spread: 70,
      origin: { x: 0.3, y: 0.6 },
      colors: ['#c0392b', '#e74c3c', '#f39c12', '#3498db', '#2ecc71', '#f5b7b1', '#fce4e4'],
      ticks: 120,
    });
    confetti({
      particleCount: 80,
      spread: 70,
      origin: { x: 0.7, y: 0.6 },
      colors: ['#c0392b', '#e74c3c', '#f39c12', '#3498db', '#2ecc71', '#f5b7b1', '#fce4e4'],
      ticks: 120,
    });
  }

  function fireHearts() {
    if (typeof confetti !== 'function') return;

    // heart-shaped confetti (emoji shapes)
    confetti({
      particleCount: 30,
      spread: 60,
      origin: { x: 0.5, y: 0.5 },
      shapes: ['circle'],
      colors: ['#e74c3c', '#c0392b', '#f5b7b1', '#ff69b4'],
      scalar: 1.2,
      ticks: 100,
    });
  }

  /* ══════════════════════════════════════════════════════════
     WEB AUDIO — POP / CHIME SOUND (no external files)
     ══════════════════════════════════════════════════════════ */
  function playPopSound() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();

      // Pop sound — short sine burst with pitch drop
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(900, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(200, ctx.currentTime + 0.15);
      gain.gain.setValueAtTime(0.4, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.2);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(ctx.currentTime);
      osc.stop(ctx.currentTime + 0.2);

      // Chime — higher pitched follow-up
      const osc2 = ctx.createOscillator();
      const gain2 = ctx.createGain();
      osc2.type = 'triangle';
      osc2.frequency.setValueAtTime(1200, ctx.currentTime + 0.08);
      osc2.frequency.exponentialRampToValueAtTime(800, ctx.currentTime + 0.3);
      gain2.gain.setValueAtTime(0.2, ctx.currentTime + 0.08);
      gain2.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
      osc2.connect(gain2);
      gain2.connect(ctx.destination);
      osc2.start(ctx.currentTime + 0.08);
      osc2.stop(ctx.currentTime + 0.35);

      // Close context after sounds finish
      setTimeout(() => ctx.close(), 500);
    } catch (e) {
      // Web Audio not available — fail silently
    }
  }

  /* ══════════════════════════════════════════════════════════
     RESET STATE (when looping back to scene 1)
     ══════════════════════════════════════════════════════════ */
  const originalGoToScene = goToScene;
  goToScene = function(n) {
    if (n === 1) {
      // Reset scene 1 elements
      const flames = document.getElementById('flames');
      const smoke = document.getElementById('smoke');
      const cakeWrapper = document.getElementById('cakeWrapper');
      const btn = document.getElementById('btnBlow');

      flames.classList.remove('blown-out');
      smoke.classList.remove('show');
      cakeWrapper.classList.remove('scale-bounce');
      btn.disabled = false;
      btn.style.opacity = '1';
    }
    originalGoToScene(n);
  };
</script>
